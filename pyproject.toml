[project]
name = "alocacao_equipamento"
version = "0.1.0"
description = "Software interno anexo do Taskflow. Módulo de gestão do almoxarifado."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "granian>=2.7.9",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
]
[tool.pytest.ini_options]
pythonpath = "."
addopts = "--disable-warnings"
filterwarnings = ["ignore"]
